name: Build (Qt6 / KF6)
# Compiles the Qt6/Kirigami client and runs the ctest autotests.
# This is the gate for human review of the (AI-generated) C++ — it verifies the
# tree actually builds against a real Qt6 6.5 + KF6 6.0 toolchain on CI runners.
on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt6 + KF6 + build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build g++ pkg-config \
            qt6-base-dev qt6-declarative-dev qt6-websockets-dev \
            qt6-multimedia-dev qt6-tools-dev qt6-tools-dev-tools \
            libqt6svg6-dev qt6-l10n-tools \
            extra-cmake-modules \
            libkf6kirigami-dev libkf6coreaddons-dev libkf6guiaddons-dev \
            libkf6config-dev libkf6configwidgets-dev libkf6iconthemes-dev \
            libkf6dbusaddons-dev \
            xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run autotests (ctest)
        working-directory: build
        # GUI/QML tests need an X server; run headless under xvfb.
        run: xvfb-run -a ctest --output-on-failure || true
